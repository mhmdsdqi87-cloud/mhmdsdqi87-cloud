<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="A constellation linking eight golden nodes with two traveling pulses">
  <defs>
    <linearGradient id="cLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#D4AF37" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cTail" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#FFF7D6" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFF7D6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="150" fill="#050505"/>

  <!-- faint dust stars -->
  <circle cx="140" cy="30" r="0.9" fill="#C9C9C9" opacity="0.5"><animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="300" cy="120" r="0.8" fill="#F7E394" opacity="0.4"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.6s" repeatCount="indefinite"/></circle>
  <circle cx="470" cy="118" r="0.9" fill="#C9C9C9" opacity="0.4"><animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.7s" repeatCount="indefinite"/></circle>
  <circle cx="610" cy="24" r="0.8" fill="#F7E394" opacity="0.5"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.3s" repeatCount="indefinite"/></circle>
  <circle cx="760" cy="124" r="0.9" fill="#C9C9C9" opacity="0.35"><animate attributeName="opacity" values="0.35;0.8;0.35" dur="4.1s" repeatCount="indefinite"/></circle>
  <circle cx="905" cy="26" r="0.8" fill="#F7E394" opacity="0.45"><animate attributeName="opacity" values="0.45;0.9;0.45" dur="3.1s" repeatCount="indefinite"/></circle>
  <circle cx="1065" cy="120" r="0.9" fill="#C9C9C9" opacity="0.4"><animate attributeName="opacity" values="0.4;0.85;0.4" dur="3.8s" repeatCount="indefinite"/></circle>

  <!-- constellation line -->
  <path d="M70,96 L215,52 L365,88 L520,44 L672,90 L830,48 L985,92 L1130,58" fill="none" stroke="url(#cLine)" stroke-width="1.1"/>
  <path d="M70,96 L215,52 L365,88 L520,44 L672,90 L830,48 L985,92 L1130,58" fill="none" stroke="#D4AF37" stroke-opacity="0.16" stroke-width="3" stroke-linecap="round">
    <animate attributeName="stroke-opacity" values="0.16;0.3;0.16" dur="5s" repeatCount="indefinite"/>
  </path>

  <!-- traveling pulses (opposite directions) -->
  <g>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.9;1" dur="6.5s" repeatCount="indefinite"/>
    <animateMotion dur="6.5s" repeatCount="indefinite" path="M70,96 L215,52 L365,88 L520,44 L672,90 L830,48 L985,92 L1130,58" rotate="auto"/>
    <line x1="0" y1="0" x2="-34" y2="0" stroke="url(#cTail)" stroke-width="1.6" stroke-linecap="round"/>
    <circle r="2.6" fill="#FFF7D6"/>
  </g>
  <g>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.9;1" dur="8.5s" begin="-3s" repeatCount="indefinite"/>
    <animateMotion dur="8.5s" begin="-3s" repeatCount="indefinite" path="M1130,58 L985,92 L830,48 L672,90 L520,44 L365,88 L215,52 L70,96" rotate="auto"/>
    <line x1="0" y1="0" x2="-30" y2="0" stroke="url(#cTail)" stroke-width="1.4" stroke-linecap="round"/>
    <circle r="2.2" fill="#F7E394"/>
  </g>

  <!-- meteors -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.75;1" dur="7.5s" begin="1.4s" repeatCount="indefinite"/>
    <line x1="180" y1="14" x2="300" y2="52" stroke="url(#cTail)" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="180" cy="14" r="1.8" fill="#FFF7D6"/>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.75;1" dur="9s" begin="4.6s" repeatCount="indefinite"/>
    <line x1="1020" y1="18" x2="905" y2="58" stroke="url(#cTail)" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="1020" cy="18" r="1.6" fill="#FFF7D6"/>
  </g>

  <g>
    <circle cx="70" cy="96" r="9" fill="#D4AF37" opacity="0.22">
      <animate attributeName="r" values="7;13;7" dur="2.2s" begin="0.0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.22;0.05;0.22" dur="2.2s" begin="0.0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70" cy="96" r="3" fill="#F7E394">
      <animate attributeName="opacity" values="1;0.55;1" dur="2.2s" begin="0.0s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g>
    <circle cx="215" cy="52" r="9" fill="#9A9AA4" opacity="0.22">
      <animate attributeName="r" values="7;13;7" dur="2.9000000000000004s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.22;0.05;0.22" dur="2.9000000000000004s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="215" cy="52" r="3" fill="#E8E8E8">
      <animate attributeName="opacity" values="1;0.55;1" dur="2.9000000000000004s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g>
    <circle cx="365" cy="88" r="9" fill="#9A9AA4" opacity="0.22">
      <animate attributeName="r" values="7;13;7" dur="3.6s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.22;0.05;0.22" dur="3.6s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="365" cy="88" r="3" fill="#E8E8E8">
      <animate attributeName="opacity" values="1;0.55;1" dur="3.6s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g>
    <circle cx="520" cy="44" r="9" fill="#D4AF37" opacity="0.22">
      <animate attributeName="r" values="7;13;7" dur="4.3s" begin="1.2000000000000002s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.22;0.05;0.22" dur="4.3s" begin="1.2000000000000002s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="44" r="3" fill="#F7E394">
      <animate attributeName="opacity" values="1;0.55;1" dur="4.3s" begin="1.2000000000000002s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g>
    <circle cx="672" cy="90" r="9" fill="#9A9AA4" opacity="0.22">
      <animate attributeName="r" values="7;13;7" dur="2.2s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.22;0.05;0.22" dur="2.2s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="672" cy="90" r="3" fill="#E8E8E8">
      <animate attributeName="opacity" values="1;0.55;1" dur="2.2s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g>
    <circle cx="830" cy="48" r="9" fill="#9A9AA4" opacity="0.22">
      <animate attributeName="r" values="7;13;7" dur="2.9000000000000004s" begin="2.0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.22;0.05;0.22" dur="2.9000000000000004s" begin="2.0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="830" cy="48" r="3" fill="#E8E8E8">
      <animate attributeName="opacity" values="1;0.55;1" dur="2.9000000000000004s" begin="2.0s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g>
    <circle cx="985" cy="92" r="9" fill="#D4AF37" opacity="0.22">
      <animate attributeName="r" values="7;13;7" dur="3.6s" begin="2.4000000000000004s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.22;0.05;0.22" dur="3.6s" begin="2.4000000000000004s" repeatCount="indefinite"/>
    </circle>
    <circle cx="985" cy="92" r="3" fill="#F7E394">
      <animate attributeName="opacity" values="1;0.55;1" dur="3.6s" begin="2.4000000000000004s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g>
    <circle cx="1130" cy="58" r="9" fill="#9A9AA4" opacity="0.22">
      <animate attributeName="r" values="7;13;7" dur="4.3s" begin="2.8000000000000003s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.22;0.05;0.22" dur="4.3s" begin="2.8000000000000003s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1130" cy="58" r="3" fill="#E8E8E8">
      <animate attributeName="opacity" values="1;0.55;1" dur="4.3s" begin="2.8000000000000003s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
