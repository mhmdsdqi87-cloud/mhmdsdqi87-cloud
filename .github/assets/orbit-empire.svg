  <circle cx="945.7" cy="42.0" r="0.9" fill="#F7E394" opacity="0.25"><animate attributeName="opacity" values="0.25;0.55;0.25" dur="4.83s" begin="3.47s" repeatCount="indefinite"/></circle>
  <circle cx="1169.0" cy="338.0" r="1.25" fill="#D8D8D8" opacity="0.54"><animate attributeName="opacity" values="0.54;0.8400000000000001;0.54" dur="2.87s" begin="0.08s" repeatCount="indefinite"/></circle>
  <circle cx="80.3" cy="74.7" r="0.84" fill="#D8D8D8" opacity="0.22"><animate attributeName="opacity" values="0.22;0.52;0.22" dur="3.79s" begin="2.2s" repeatCount="indefinite"/></circle>
  <circle cx="1187.2" cy="348.5" r="1.44" fill="#F7E394" opacity="0.59"><animate attributeName="opacity" values="0.59;0.8899999999999999;0.59" dur="3.35s" begin="1.15s" repeatCount="indefinite"/></circle>
  <circle cx="92.9" cy="270.5" r="1.0" fill="#D8D8D8" opacity="0.67"><animate attributeName="opacity" values="0.67;0.97;0.67" dur="3.56s" begin="4.79s" repeatCount="indefinite"/></circle>
  <circle cx="10.6" cy="81.3" r="1.51" fill="#F7E394" opacity="0.46"><animate attributeName="opacity" values="0.46;0.76;0.46" dur="5.34s" begin="1.99s" repeatCount="indefinite"/></circle>
  <circle cx="328.3" cy="39.6" r="0.93" fill="#F7E394" opacity="0.73"><animate attributeName="opacity" values="0.73;1;0.73" dur="4.67s" begin="0.59s" repeatCount="indefinite"/></circle>
  <circle cx="129.2" cy="30.4" r="1.4" fill="#F7E394" opacity="0.3"><animate attributeName="opacity" values="0.3;0.6;0.3" dur="4.08s" begin="2.24s" repeatCount="indefinite"/></circle>
  <circle cx="873.6" cy="54.5" r="1.24" fill="#F7E394" opacity="0.26"><animate attributeName="opacity" values="0.26;0.56;0.26" dur="3.66s" begin="1.06s" repeatCount="indefinite"/></circle>
  <circle cx="1155.7" cy="283.2" r="0.9" fill="#D8D8D8" opacity="0.69"><animate attributeName="opacity" values="0.69;0.99;0.69" dur="3.03s" begin="1.97s" repeatCount="indefinite"/></circle>
  <circle cx="767.4" cy="44.1" r="1.59" fill="#D8D8D8" opacity="0.32"><animate attributeName="opacity" values="0.32;0.62;0.32" dur="3.17s" begin="3.86s" repeatCount="indefinite"/></circle>
  <circle cx="359.7" cy="35.0" r="0.69" fill="#D8D8D8" opacity="0.52"><animate attributeName="opacity" values="0.52;0.8200000000000001;0.52" dur="3.13s" begin="3.01s" repeatCount="indefinite"/></circle>
  <circle cx="1032.5" cy="72.2" r="0.75" fill="#F7E394" opacity="0.7"><animate attributeName="opacity" values="0.7;1.0;0.7" dur="4.85s" begin="1.25s" repeatCount="indefinite"/></circle>
  <circle cx="882.5" cy="329.7" r="0.8" fill="#D8D8D8" opacity="0.72"><animate attributeName="opacity" values="0.72;1;0.72" dur="5.05s" begin="3.02s" repeatCount="indefinite"/></circle>
  <circle cx="132.5" cy="23.2" r="1.56" fill="#D8D8D8" opacity="0.33"><animate attributeName="opacity" values="0.33;0.63;0.33" dur="4.51s" begin="1.28s" repeatCount="indefinite"/></circle>
  <circle cx="217.0" cy="254.9" r="0.67" fill="#D8D8D8" opacity="0.33"><animate attributeName="opacity" values="0.33;0.63;0.33" dur="4.08s" begin="4.26s" repeatCount="indefinite"/></circle>
  <circle cx="340.7" cy="321.9" r="0.8" fill="#F7E394" opacity="0.21"><animate attributeName="opacity" values="0.21;0.51;0.21" dur="3.21s" begin="2.23s" repeatCount="indefinite"/></circle>
