      <stop offset="0" stop-color="#5A430E"/><stop offset="0.24" stop-color="#A87F1E"/>
      <stop offset="0.52" stop-color="#E9C75C"/><stop offset="0.78" stop-color="#F7E394"/>
      <stop offset="1" stop-color="#FFF7D6"/>
