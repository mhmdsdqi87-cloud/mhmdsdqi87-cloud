    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F7E394" stop-opacity="0.2"/><stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="satGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F7E394" stop-opacity="0.5"/><stop offset="1" stop-color="#F7E394" stop-opacity="0"/>
    </radialGradient>
    <path id="o1" d="M472,182 C472,120 536,90 600,90 C664,90 728,120 728,182 C728,244 664,274 600,274 C536,274 472,244 472,182 Z" fill="none"/>
    <path id="o2" d="M374,182 C374,78 488,26 600,26 C712,26 826,78 826,182 C826,286 712,338 600,338 C488,338 374,286 374,182 Z" fill="none"/>
    <path id="o3" d="M270,182 C270,36 438,-36 600,-36 C762,-36 930,36 930,182 C930,328 762,400 600,400 C438,400 270,328 270,182 Z" fill="none"/>
